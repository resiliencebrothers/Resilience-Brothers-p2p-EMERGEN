crons:
  - name: bookings-tick
    description: "Service bookings: reminders ~24h ahead, auto-refund unanswered bookings, release funds for completed appointments"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/bookings-tick"
    method: POST
    enabled: true
